<!DOCTYPE html>
<html lang="no">
<head>

    <title>Racing Quiz: Jehovas Vitner</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', -apple-system, sans-serif;
            background: #1a0533;
            color: #fff;
            overflow: hidden;
            height: 100vh; width: 100vw;
            touch-action: none;
            user-select: none; -webkit-user-select: none;
        }
        canvas { display: block; }
        .screen {
            display: none; position: fixed; inset: 0;
            flex-direction: column; align-items: center; justify-content: center;
            gap: 16px; padding: 20px; z-index: 10;
            background: linear-gradient(135deg, #46178f 0%, #1a0533 100%);
            animation: fadeIn .3s ease;
            overflow-y: auto;

        .screen.active { display: flex; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

            text-align: center; background: rgba(255,255,255,.15); color: #fff;
            outline: none;
        }
        input::placeholder { color: rgba(255,255,255,.45); }
        input:focus { background: rgba(255,255,255,.25); }

            padding: 13px 40px; border: none; border-radius: 8px;
            font-size: 1rem; font-weight: 700; font-family: inherit;
            cursor: pointer; text-transform: uppercase; letter-spacing: 1px;

        .btn-primary { background: linear-gradient(135deg,#ff6b35,#f7c948); color: #1a0533; }

            font-size: 2.8rem; font-weight: 900; letter-spacing: 10px;
            background: rgba(255,255,255,.08); padding: 12px 28px; border-radius: 14px;

            padding:10px 14px 8px; border-radius:12px;

            font-weight:600; font-size:.85rem; animation:popIn .3s ease;
            min-width:80px;
        }
        .player-badge img { width:48px; height:48px; object-fit:contain; image-rendering:pixelated; }

        #quiz-overlay {
            display:none; position:fixed; inset:0; z-index:20;
            background: rgba(10,5,30,.92);
            flex-direction:column; align-items:center; justify-content:center;
            padding:20px; gap:16px;
            backdrop-filter: blur(6px);

        .quiz-question {
            font-size: 1.15rem; font-weight: 700; text-align:center;

            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 16px;

            font-size: 1rem; font-weight: 600;
            color: #fff;
            cursor: pointer;
            font-family: inherit;

        .quiz-opt:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.25); }

            background: rgba(255,255,255,.1);
            font-weight: 800; font-size: .9rem;
            flex-shrink: 0;
        }

        .quiz-opt.wrong-reveal { border-color: #f87171; background: rgba(248,113,113,.1); opacity: .5; }
        .quiz-opt:disabled { cursor:default; }
        .quiz-feedback {
            font-size:1.05rem; font-weight:700; text-align:center;
            padding:10px 20px; border-radius:10px;
        }
        /* Quiz timer bar */
        .quiz-timer-wrap {
            width:100%; max-width:480px; height:8px;
            background:rgba(255,255,255,.1); border-radius:4px;
            overflow:hidden; margin-bottom:4px;
        }
        .quiz-timer-bar {
            height:100%; border-radius:4px;
            background:linear-gradient(90deg,#4ade80,#fbbf24);
            transition: width .1s linear, background .3s;
        }
        .quiz-timer-bar.urgent { background:linear-gradient(90deg,#f87171,#ef4444); }
        @keyframes timerPulse {
            0%,100%{box-shadow:none}
            50%{box-shadow:inset 0 0 30px rgba(248,113,113,.3)}
        }
        #quiz-overlay.timer-urgent { animation: timerPulse .5s infinite; }

        /* Countdown */
        #countdown-overlay {
            display:none; position:fixed; inset:0; z-index:25;
            background:rgba(0,0,0,.7);
            align-items:center; justify-content:center;
            font-size:8rem; font-weight:900;
            text-shadow: 0 0 40px rgba(255,107,53,.6);
        }
        #countdown-overlay.active { display:flex; }

        /* Results */
        #results-overlay {
            display:none; position:fixed; inset:0; z-index:20;

        .results-item {
            display:flex; align-items:center; padding:12px 18px;

        #mobile-controls {

        }
        .ctrl-btn {
            flex:1; padding:22px; border:none; border-radius:12px;
            font-size:1.8rem; font-weight:900;
            background:rgba(255,255,255,.15); color:#fff;
            cursor:pointer; -webkit-tap-highlight-color:transparent;
        }

        /* Character select */
        .char-grid { display:flex; gap:20px; justify-content:center; flex-wrap:wrap; margin:12px 0; }

        .promo-section { margin:16px 0 0; display:flex; gap:8px; justify-content:center; align-items:center; }
        .promo-section input { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); border-radius:10px; color:#fff; padding:10px 14px; font-size:.95rem; width:180px; text-align:center; font-family:inherit; letter-spacing:2px; text-transform:uppercase; }

        .promo-section button { background:linear-gradient(135deg,#ff6b35,#ff4500); border:none; color:#fff; padding:10px 18px; border-radius:10px; font-weight:700; font-size:.9rem; cursor:pointer; font-family:inherit; }
        .promo-msg { text-align:center; font-size:.85rem; margin-top:6px; min-height:20px; }
        .promo-msg.success { color:#4ade80; }
        .promo-msg.error { color:#f87171; }

            h1{font-size:1.6rem}
            .room-code{font-size:2rem;letter-spacing:6px}
            .quiz-question{font-size:1rem;padding:14px 18px}
            .quiz-opt{padding:12px 16px;font-size:.92rem}
            .char-card{width:120px;padding:14px 10px 12px}
            .char-card img{width:64px}
        }
    </style>
</head>

</div>

// Car has a worldX that must be steered to follow the road.
// ================================================================
const TRACK_LENGTH = 48000;
const ROAD_W = 210;
const CAR_W = 26, CAR_H = 46;
const BASE_SPEED = 3.0;
const BOOST_SPEED = 6.0;
const GRASS_SLOW = 1.0;

const FINISH_DIST = TRACK_LENGTH;

// Curve control points [dist, worldCenterX] — gentle curves, mostly straight
const CURVES = [
    [0,0],[1500,0],[2500,40],[3000,30],
    [4000,0],[5000,-40],[6000,-20],
    [7000,0],[8000,50],[9000,30],
    [10000,0],[11000,-30],[12000,0],
    [13500,40],[15000,20],
    [16000,0],[17000,-50],[18000,-30],
    [19000,0],[20000,40],[21000,20],
    [22000,0],[23000,-30],[24000,0],
    [25500,50],[27000,30],
    [28000,0],[29000,-40],[30000,-20],
    [31000,0],[32000,30],[33000,20],
    [34000,0],[35000,-30],[36000,0],
    [37500,40],[39000,20],
    [40000,0],[41000,-40],[42000,-20],
    [43000,0],[44000,30],[45000,20],
    [46000,0],[47000,-20],[48000,0]
];

function roadCenterX(dist) {
    if (dist <= CURVES[0][0]) return CURVES[0][1];
    if (dist >= CURVES[CURVES.length-1][0]) return CURVES[CURVES.length-1][1];
    for (let i = 0; i < CURVES.length-1; i++) {
        const [d0,x0] = CURVES[i], [d1,x1] = CURVES[i+1];
        if (dist >= d0 && dist <= d1) {
            const t = (dist-d0)/(d1-d0);
            const s = t*t*(3-2*t); // smoothstep
            return x0+(x1-x0)*s;
        }
    }
    return 0;
}

function seededRandom(seed) {
    let s=seed;
    return function(){ s=(s*16807)%2147483647; return(s-1)/2147483646; };
}
function generateObstacles(seed) {
    const rng = seededRandom(seed);
    obstacles = []; grassTufts = []; collectibles = [];
    for (let d = 200; d < FINISH_DIST-200; d += 90+rng()*70) {
        let nearCP = false;
        for (const cp of CHECKPOINT_DISTS) if (Math.abs(d-cp)<180) nearCP=true;
        if (Math.abs(d-FINISH_DIST)<180) nearCP=true;
        if (nearCP) continue;
        const rc = roadCenterX(d);
        const offset = rc + (rng()-0.5)*(ROAD_W-50);
        const type = rng()<0.3?'cone':rng()<0.55?'oil':'barrier';
        obstacles.push({ dist:d, worldX:offset, type,
            w: type==='barrier'?48:20, h: type==='barrier'?14:20 });
    }
    // Generate collectibles (seeded for multiplayer consistency)
    for (let d = 300; d < FINISH_DIST-300; d += 150+rng()*200) {
        let nearCP = false;
        for (const cp of CHECKPOINT_DISTS) if (Math.abs(d-cp)<120) nearCP=true;
        if (nearCP) continue;
        let nearObs = false;
        for (const obs of obstacles) if (Math.abs(d-obs.dist)<60) nearObs=true;
        if (nearObs) continue;
        const rc = roadCenterX(d);
        const offset = rc + (rng()-0.5)*(ROAD_W-80);
        const r = rng();
        const ctype = r<0.15?'shield':r<0.50?'coin':'boost';
        collectibles.push({ dist:d, worldX:offset, type:ctype, collected:false, w:22, h:22 });
    }
    for (let d=0; d<FINISH_DIST+400; d+=25+rng()*35) {
        const rc = roadCenterX(d);
        const side = rng()<0.5?-1:1;
        const off = ROAD_W/2+15+rng()*180;
        grassTufts.push({ dist:d, worldX: rc+side*off, size:3+rng()*7, dark:rng()>0.5 });
    }
}

// REST API helpers (fallback if SDK WebSocket fails)
async function fbRest(path,method,data){
    const url=DB_URL+path+'.json';
    const opts={method:method||'GET'};
    if(data!==undefined) opts.body=JSON.stringify(data);
    const res=await fetch(url,opts);
    if(!res.ok) throw new Error('Firebase REST feil: '+res.status);
    return res.json();
}
async function fbRead(path){ return fbRest(path,'GET'); }
async function fbWrite(path,data){ return fbRest(path,'PUT',data); }

// AUDIO SYSTEM (Web Audio API, no external files)

function initAudio(){
    if(audioInited) return;
    try {
        audioCtx = new (window.AudioContext||window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.3;
        masterGain.connect(audioCtx.destination);
        audioInited = true;
    } catch(e){}
}
function playTone(freq, duration, type, vol, freqEnd){
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type||'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if(freqEnd) osc.frequency.linearRampToValueAtTime(freqEnd, audioCtx.currentTime+duration);
    g.gain.setValueAtTime(vol||0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+duration);
    osc.connect(g); g.connect(masterGain);
    osc.start(); osc.stop(audioCtx.currentTime+duration);
}
function playNoise(duration, filterFreq, vol){
    if(!audioCtx) return;
    const bufSize = audioCtx.sampleRate * duration;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<bufSize;i++) data[i]=(Math.random()*2-1);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol||0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+duration);
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = filterFreq||2000;
    src.connect(filter); filter.connect(g); g.connect(masterGain);
    src.start(); src.stop(audioCtx.currentTime+duration);
}
function playCorrectSound(){ playTone(523,0.12,'sine',0.2); setTimeout(()=>playTone(659,0.18,'sine',0.2),120); }

function playBoostSound(){ playNoise(0.2,3000,0.12); }

function playShieldSound(){ playTone(600,0.2,'triangle',0.12,900); }
function startEngine(){
    if(!audioCtx) return;
    engineOsc = audioCtx.createOscillator();
    engineOsc.type = 'sawtooth';
    engineOsc.frequency.value = 60;
    engineFilter = audioCtx.createBiquadFilter();
    engineFilter.type = 'lowpass';
    engineFilter.frequency.value = 300;
    engineGain = audioCtx.createGain();
    engineGain.gain.value = 0.04;
    engineOsc.connect(engineFilter);
    engineFilter.connect(engineGain);
    engineGain.connect(masterGain);
    engineOsc.start();
}
function updateEngineSound(speed){
    if(!engineOsc) return;
    const pitch = 60 + (speed/BOOST_SPEED)*80;
    engineOsc.frequency.setTargetAtTime(pitch, audioCtx.currentTime, 0.1);
    engineFilter.frequency.setTargetAtTime(200+speed*40, audioCtx.currentTime, 0.1);
}
function stopEngine(){
    if(engineOsc){ try{engineOsc.stop();}catch(e){} engineOsc=null; }
}

// Background music (chiptune loop via Web Audio)
function startBgMusic(mode){
    stopBgMusic();
    if(!audioCtx) return;
    bgMusicGain = audioCtx.createGain();
    bgMusicGain.gain.value = mode==='race' ? 0.07 : 0.05;
    bgMusicGain.connect(masterGain);

    // Melodies: lobby = chill arpeggios, race = upbeat
    const lobbyNotes = [262,330,392,523,392,330, 294,370,440,587,440,370, 262,330,392,523,392,330, 247,311,370,494,370,311];
    const raceNotes  = [523,659,784,659,523,784, 587,740,880,740,587,880, 523,659,784,1047,784,659, 494,622,740,988,740,622];
    const notes = mode==='race' ? raceNotes : lobbyNotes;
    const tempo = mode==='race' ? 130 : 180;
    let step = 0;

    function playNote(){
        if(!audioCtx||!bgMusicGain) return;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = mode==='race' ? 'square' : 'triangle';
        osc.frequency.value = notes[step % notes.length];
        const dur = 60/tempo;
        g.gain.setValueAtTime(0.3, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur*0.9);
        osc.connect(g); g.connect(bgMusicGain);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
        step++;
    }

    playNote();
    bgMusicInterval = setInterval(playNote, (60/tempo)*1000);
}
function stopBgMusic(){
    if(bgMusicInterval){ clearInterval(bgMusicInterval); bgMusicInterval=null; }
    if(bgMusicGain){ try{bgMusicGain.disconnect();}catch(e){} bgMusicGain=null; }
}

async function createRoom() {
    const btn=document.getElementById('btn-create');
    btn.disabled=true; btn.textContent='Oppretter...';
    try {
        myName = '__host__';
        roomCode = generateCode();
        isHost = true;
        const seed = Math.floor(Math.random()*999999)+1;
        // Use REST API (works even if WebSocket is blocked)
        await fbWrite('/rooms/'+roomCode, { host:'__host__', state:'lobby', seed, created:Date.now() });
        roomRef = db.ref('rooms/'+roomCode);
        document.getElementById('display-code').textContent = roomCode;
        document.getElementById('btn-start').style.display = '';
        document.getElementById('waiting-host').style.display = 'none';
        gameState = 'lobby';
        showScreen('lobby');
        startBgMusic('lobby');
        listenToRoom();
    } catch(e) {
        document.getElementById('conn-status').textContent = 'Feil: '+e.message;
        isHost=false; roomRef=null;
    }
    btn.disabled=false; btn.textContent='Opprett spill';
}
async function joinRoom() {
    const btn=document.getElementById('btn-join');
    btn.disabled=true; btn.textContent='Kobler til...';
    try {
        showStatus('Sjekker spillkode...',false);
        // Use REST API for reliability
        const data = await fbRead('/rooms/'+roomCode);
        if(!data){showStatus('Finner ikke spillet. Sjekk koden.',true);btn.disabled=false;btn.textContent='Bli med i spill';return;}
        if(data.state!=='lobby'){showStatus('Spillet har allerede startet.',true);btn.disabled=false;btn.textContent='Bli med i spill';return;}
        myName = safeName(myName);
        if(!myName){showStatus('Ugyldig navn.',true);btn.disabled=false;btn.textContent='Bli med i spill';return;}
        if(data.players&&data.players[myName]){showStatus('Navnet er tatt, prøv et annet.',true);btn.disabled=false;btn.textContent='Bli med i spill';return;}
        showStatus('Blir med...',false);
        await fbWrite('/rooms/'+roomCode+'/players/'+myName, { worldX:0, dist:0, speed:BASE_SPEED, finished:false, finishTime:null, checkpoint:0, character:'luke' });
        roomRef = db.ref('rooms/'+roomCode);
        document.getElementById('display-code').textContent = roomCode;
        document.getElementById('btn-start').style.display = 'none';
        document.getElementById('waiting-host').style.display = '';
        showScreen('charselect');
        populateCharSelect();
        listenToRoom();
    } catch(e) { showStatus('Feil: '+e.message,true); }
    btn.disabled=false; btn.textContent='Bli med i spill';
}

let pollInterval=null;
function handleRoomData(data) {
    if(!data) return;
    const players = data.players||{};
    const names = Object.keys(players);
    const plEl=document.getElementById('player-list');
    const pcEl=document.getElementById('player-count');
    if(plEl) {
        const charSrcs={luke:dogImg.src,asta:astaImg.src,kasper:kasperImg.src,albin:albinImg.src,admin:adminImg.src,leader:leaderImg.src};
        plEl.innerHTML = names.map(n => {
            const ch = (players[n]&&players[n].character)||'luke';
            const src = charSrcs[ch]||charSrcs.luke;
            return '<div class="player-badge" style="border-color:'+nameColor(n)+';color:'+nameColor(n)+'">'
                +'<img src="'+src+'">'
                +'<span>'+esc(n)+'</span></div>';
        }).join('');
    }
    if(pcEl) pcEl.textContent = names.length;

    otherPlayers = {};
    for (const [n,d] of Object.entries(players)) {
        if (n !== myName) otherPlayers[n] = d;
    }
    if (isHost && names.length > 0) {
        let best = null, bestDist = -1;
        for (const [n,d] of Object.entries(players)) {
            if ((d.dist||0) > bestDist) { bestDist=d.dist||0; best=n; }
        }
        spectateTarget = best;
    }

    if (data.state==='racing' && gameState==='lobby') {
        generateObstacles(data.seed||1);
        selectQuestions(data.seed||1);
        if (isHost) startHostSpectate();
        else startCountdown();
    }
    if (data.state==='finished' && gameState!=='finished') showResults(data);
}
function listenToRoom() {
    // Try SDK listener
    let sdkWorking=false;
    if(roomRef) {
        roomRef.on('value', snap => {
            sdkWorking=true;
            handleRoomData(snap.val());
        });
    }
    // Also start REST polling as fallback
    if(pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(async()=>{
        if(sdkWorking) return; // SDK is working, skip polling
        try {
            const data = await fbRead('/rooms/'+roomCode);
            handleRoomData(data);
        } catch(e){}
    }, gameState==='racing'?300:2000);
}

let hostCanvas, hostCtx, hostW, hostH;
function startHostSpectate() {
    gameState = 'racing';
    startBgMusic('race');
    hideAllScreens();
    const overlay = document.getElementById('host-overlay');
    overlay.classList.add('active');
    // Wait one frame for layout to calculate before reading sizes
    requestAnimationFrame(()=>{
        hostCanvas = document.getElementById('host-canvas');
        const box = document.querySelector('.host-track');
        hostW = box.clientWidth || 400;
        hostH = box.clientHeight || 300;
        hostCanvas.width = hostW;
        hostCanvas.height = hostH;
        hostCtx = hostCanvas.getContext('2d');
        requestAnimationFrame(hostLoop);
    });
}
function hostLoop() {
    if (gameState !== 'racing') return;
    renderHostCanvas();
    renderHostPlayerList();
    requestAnimationFrame(hostLoop);
}
function renderHostCanvas() {
    const c = hostCtx;
    c.clearRect(0, 0, hostW, hostH);
    // Follow leading player
    let camX = 0, camD = 0;
    if (spectateTarget && otherPlayers[spectateTarget]) {
        camX = otherPlayers[spectateTarget].worldX || 0;
        camD = otherPlayers[spectateTarget].dist || 0;
    }
    // Draw road on host canvas (simplified)
    c.fillStyle = '#2d6b28'; c.fillRect(0, 0, hostW, hostH);
    const step = 5;
    const startD = camD - hostH * 0.3, endD = camD + hostH + 50;
    for (let d = endD; d >= startD; d -= step) {
        const rc = roadCenterX(d);
        const sx = rc - camX + hostW / 2;
        const sy = hostH * 0.7 - (d - camD);
        c.fillStyle = '#555';
        c.fillRect(sx - ROAD_W / 2, sy, ROAD_W, step + 1);
        const cb = Math.floor(d / 20) % 2;
        c.fillStyle = cb ? '#cc0000' : '#fff';
        c.fillRect(sx - ROAD_W / 2 - 5, sy, 5, step + 1);
        c.fillRect(sx + ROAD_W / 2, sy, 5, step + 1);
    }
    // Checkpoints on host canvas
    for (let i = 0; i < CHECKPOINT_DISTS.length; i++) {
        const cd = CHECKPOINT_DISTS[i], rc = roadCenterX(cd);
        const sx = rc - camX + hostW / 2;
        const sy = hostH * 0.7 - (cd - camD);
        if (sy < -40 || sy > hostH + 40) continue;
        c.fillStyle = 'rgba(255,107,53,.35)';
        c.fillRect(sx - ROAD_W / 2, sy - 12, ROAD_W, 24);
        c.fillStyle = '#fff'; c.font = '700 11px Montserrat'; c.textAlign = 'center';
        c.fillText('CP ' + (i + 1), sx, sy + 4);
    }
    // Finish
    const frc = roadCenterX(FINISH_DIST);
    const fsx = frc - camX + hostW / 2;
    const fsy = hostH * 0.7 - (FINISH_DIST - camD);
    if (fsy > -40 && fsy < hostH + 40) {
        const sq = 10;
        for (let ix = 0; ix < Math.ceil(ROAD_W / sq); ix++) for (let iy = 0; iy < 2; iy++) {
            c.fillStyle = (ix + iy) % 2 === 0 ? '#fff' : '#111';
            c.fillRect(fsx - ROAD_W / 2 + ix * sq, fsy - 10 + iy * sq, sq, sq);
        }
    }
    // Obstacles
    for (const obs of obstacles) {
        const sx = obs.worldX - camX + hostW / 2;
        const sy = hostH * 0.7 - (obs.dist - camD);
        if (sy < -30 || sy > hostH + 30) continue;
        if (obs.type === 'cone') { c.fillStyle = '#ff6600'; c.beginPath(); c.moveTo(sx, sy - 8); c.lineTo(sx - 6, sy + 6); c.lineTo(sx + 6, sy + 6); c.closePath(); c.fill(); }
        else if (obs.type === 'oil') { c.fillStyle = 'rgba(20,20,20,.7)'; c.beginPath(); c.ellipse(sx, sy, 10, 6, 0, 0, Math.PI * 2); c.fill(); }
        else { c.fillStyle = '#cc0000'; c.fillRect(sx - 18, sy - 5, 36, 10); }
    }
    // All player cars
    for (const [name, d] of Object.entries(otherPlayers)) {
        const sx = (d.worldX || 0) - camX + hostW / 2;
        const sy = hostH * 0.7 - ((d.dist || 0) - camD);
        if (sy < -60 || sy > hostH + 60) continue;
        // Mini character
        const pCh=CHARACTERS[d.character||'luke'];
        const pImg=(pCh&&pCh.ready)?pCh.img:(dogReady?dogImg:null);
        if(pImg){ c.drawImage(pImg, sx-20, sy-19, 40, 38); }
        else { c.fillStyle=nameColor(name); c.beginPath(); c.arc(sx,sy,12,0,Math.PI*2); c.fill(); }
        // Name above character
        c.fillStyle = '#fff'; c.font = '600 9px Montserrat'; c.textAlign = 'center';
        c.fillText(name, sx, sy - 24);
    }
    // "Følger: <name>" label
    if (spectateTarget) {
        c.fillStyle = 'rgba(0,0,0,.5)';
        c.beginPath(); c.roundRect(8, 8, 140, 24, 6); c.fill();
        c.fillStyle = '#fff'; c.font = '600 10px Montserrat'; c.textAlign = 'left';
        c.fillText('F\u00f8lger: ' + spectateTarget, 14, 24);
    }
}
function renderHostPlayerList() {
    const el = document.getElementById('host-players');
    const entries = Object.entries(otherPlayers)
        .map(([n, d]) => ({ name: n, dist: d.dist || 0, finished: d.finished, time: d.finishTime }))
        .sort((a, b) => b.dist - a.dist);
    el.innerHTML = entries.map(p => {
        const pct = Math.min(100, (p.dist / FINISH_DIST) * 100);
        const label = p.finished ? p.time.toFixed(1) + 's' : Math.round(pct) + '%';
        return '<div class="host-player-row">' +
            '<div class="hname" style="color:' + nameColor(p.name) + '">' + esc(p.name) + '</div>' +
            '<div class="hbar"><div class="hbar-fill" style="width:' + pct + '%;background:' + nameColor(p.name) + '"></div></div>' +
            '<div class="hpct">' + label + '</div></div>';
    }).join('');
}

    activePenalty=null; penaltyEndTime=0; boostEndTime=0; inkBlobs=[];

    hasShield=false; shieldPulse=0; coinCount=0; coinBoostEnd=0;
    screenShakeAmt=0; boostParticles=[]; confettiParticles=[];
    speedLines=[]; checkpointFlashAlpha=0; carTilt=0; carTiltTarget=0;
    for(const c of collectibles) c.collected=false;

        else { clearInterval(iv); ov.classList.remove('active'); gameState='racing'; raceStartTime=performance.now(); showMobileControls(true); startEngine(); startBgMusic('race'); requestAnimationFrame(gameLoop); }
    },800);
}

function gameLoop() {
    if(gameState!=='racing'&&gameState!=='checkpoint') return;
    update(); render(); requestAnimationFrame(gameLoop);
}

// ================================================================
// UPDATE
// ================================================================
function update() {
    if(gameState!=='racing'||finished) return;
    const now=performance.now();
    // Speed
    let speed=BASE_SPEED;
    if(now<boostEndTime) speed=BOOST_SPEED;
    if(now<coinBoostEnd) speed=Math.max(speed, BASE_SPEED*1.3);
    if(activePenalty==='slow'&&now<penaltyEndTime) speed=BASE_SPEED*0.5;
    if(activePenalty==='spin'&&now<penaltyEndTime) speed=BASE_SPEED*0.3;
    if(activePenalty&&now>=penaltyEndTime) activePenalty=null;

    // On grass? (worldX far from road center)
    const rc = roadCenterX(car.dist);
    const offRoad = Math.abs(car.worldX - rc) - ROAD_W/2;
    if (offRoad > 0) speed = GRASS_SLOW;

    car.speed=speed;
    car.dist+=speed;

    // Update engine sound
    updateEngineSound(speed);

    // Steering — in world X space
    let left=steerLeft, right=steerRight;
    if(activePenalty==='reverse'&&now<penaltyEndTime){const t=left;left=right;right=t;}
    let steer=0;
    if(left) steer-=STEER_SPEED;
    if(right) steer+=STEER_SPEED;
    if(activePenalty==='ice'&&now<penaltyEndTime) steer+=Math.sin(now/150)*2.5;
    car.worldX+=steer;

    // Smooth car tilt
    carTiltTarget = steer*0.04;
    carTilt += (carTiltTarget - carTilt) * 0.15;

    // Screen shake decay
    screenShakeAmt *= screenShakeDecay;
    if(screenShakeAmt < 0.3) screenShakeAmt = 0;

    // Obstacle collision
    for(const obs of obstacles){
        if(Math.abs(car.dist-obs.dist)>CAR_H) continue;
        if(Math.abs(car.worldX-obs.worldX)<(CAR_W/2+obs.w/2)){
            if(hasShield){
                hasShield=false;
                playBoostSound();
            } else {
                car.dist-=speed*0.7;
                car.worldX+=(car.worldX<obs.worldX?-4:4);
                screenShakeAmt=6;
                playCrashSound();
            }
        }
    }
    // Collectible collision
    for(const col of collectibles){
        if(col.collected) continue;
        if(Math.abs(car.dist-col.dist)>CAR_H) continue;
        if(Math.abs(car.worldX-col.worldX)<(CAR_W/2+col.w/2)){
            col.collected=true;
            if(col.type==='boost'){ boostEndTime=Math.max(boostEndTime,now)+1500; playBoostSound(); }
            else if(col.type==='coin'){ coinCount++; coinBoostEnd=now+400; playCoinSound(); }
            else if(col.type==='shield'){ hasShield=true; playShieldSound(); }
        }
    }
    // Boost particles
    if(now<boostEndTime){
        for(let i=0;i<2;i++){
            boostParticles.push({
                x:car.worldX+(Math.random()-.5)*14,
                y:car.dist-CAR_H/2-Math.random()*6,
                vx:(Math.random()-.5)*1.5, vy:-1-Math.random()*2,
                life:1, color:['#ffd700','#ff6b35','#ff4444','#ffaa00'][Math.floor(Math.random()*4)]
            });
        }
    }
    // Update boost particles
    for(let i=boostParticles.length-1;i>=0;i--){
        const p=boostParticles[i];
        p.x+=p.vx; p.y+=p.vy; p.life-=0.03;
        if(p.life<=0) boostParticles.splice(i,1);
    }
    if(boostParticles.length>60) boostParticles.splice(0,boostParticles.length-60);

    // Update confetti
    for(let i=confettiParticles.length-1;i>=0;i--){
        const p=confettiParticles[i];
        p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.life-=0.008;
        if(p.life<=0) confettiParticles.splice(i,1);
    }

    // Speed lines during boost
    if(now<boostEndTime && speedLines.length<12){
        speedLines.push({x:Math.random()*W, y:-10, speed:15+Math.random()*20, life:1});
    }
    for(let i=speedLines.length-1;i>=0;i--){
        speedLines[i].y+=speedLines[i].speed;
        speedLines[i].life-=0.02;
        if(speedLines[i].life<=0||speedLines[i].y>H+20) speedLines.splice(i,1);
    }

    // Checkpoint flash decay
    if(checkpointFlashAlpha>0) checkpointFlashAlpha-=0.03;

    // Shield pulse
    if(hasShield) shieldPulse=(shieldPulse+0.05)%(Math.PI*2);

    // Checkpoint
    if(nextCheckpoint<CHECKPOINT_DISTS.length&&car.dist>=CHECKPOINT_DISTS[nextCheckpoint]){
        car.dist=CHECKPOINT_DISTS[nextCheckpoint];
        gameState='checkpoint';
        playCheckpointSound();
        checkpointFlashAlpha=0.5;
        showQuizOverlay(nextCheckpoint);
    }
    // Finish
    if(car.dist>=FINISH_DIST&&!finished){
        finished=true;
        finishTime=(performance.now()-raceStartTime)/1000;
        playFinishSound();
        // Spawn confetti
        for(let i=0;i<80;i++){
            confettiParticles.push({
                x:W/2+(Math.random()-.5)*200, y:H*0.4,
                vx:(Math.random()-.5)*8, vy:-3-Math.random()*6,
                life:1, color:['#ffd700','#ff6b35','#4ade80','#a78bfa','#f87171','#38bdf8'][Math.floor(Math.random()*6)]
            });
        }
        fbUpdate('/rooms/'+roomCode+'/players/'+myName,{finished:true,finishTime}).catch(()=>{});
    }
    // Sync
    if(now-lastSync>SYNC_INTERVAL){
        lastSync=now;
        fbUpdate('/rooms/'+roomCode+'/players/'+myName,{
            worldX:Math.round(car.worldX), dist:Math.round(car.dist),
            speed:car.speed, checkpoint:nextCheckpoint
        }).catch(()=>{});
    }
}

// ================================================================
// QUIZ OVERLAY
// ================================================================
function showQuizOverlay(cpIndex) {
    const q=selectedQuestions[cpIndex];
    quizAnswered=false;
    document.getElementById('quiz-cp-label').textContent='Checkpoint '+(cpIndex+1)+' av '+selectedQuestions.length;
    document.getElementById('quiz-question').textContent=q.q;
    document.getElementById('quiz-feedback').style.display='none';
    const letters=['A','B','C','D'];
    const grid=document.getElementById('quiz-options');
    grid.innerHTML=q.options.map((opt,i)=>
        '<button class="quiz-opt" data-i="'+i+'"><span class="opt-letter">'+letters[i]+'</span><span>'+esc(opt)+'</span></button>'
    ).join('');
    grid.querySelectorAll('.quiz-opt').forEach(btn=>{
        btn.addEventListener('click',()=>handleQuizAnswer(cpIndex,parseInt(btn.dataset.i)));
    });
    showMobileControls(false);
    const overlay=document.getElementById('quiz-overlay');
    overlay.classList.remove('timer-urgent');
    overlay.classList.add('active');
    // Start quiz timer
    quizTimerStart=performance.now();
    const timerBar=document.getElementById('quiz-timer-bar');
    timerBar.style.width='100%';
    timerBar.classList.remove('urgent');
    if(quizTimerInterval) clearInterval(quizTimerInterval);
    quizTimerInterval=setInterval(()=>{
        if(quizAnswered) return;
        const elapsed=performance.now()-quizTimerStart;
        const pct=Math.max(0,1-elapsed/QUIZ_TIME)*100;
        timerBar.style.width=pct+'%';
        const remaining=QUIZ_TIME-elapsed;
        if(remaining<=3000){
            timerBar.classList.add('urgent');
            overlay.classList.add('timer-urgent');
            if(remaining>0 && Math.floor(remaining/1000)!==Math.floor((remaining+100)/1000)) playTimerTick();
        }
        if(elapsed>=QUIZ_TIME){
            clearInterval(quizTimerInterval);
            handleQuizAnswer(cpIndex,-1); // timeout = wrong
        }
    },100);
}
function handleQuizAnswer(cpIndex, ans) {
    if(quizAnswered) return; // double-answer guard
    quizAnswered=true;
    if(quizTimerInterval){ clearInterval(quizTimerInterval); quizTimerInterval=null; }
    document.getElementById('quiz-overlay').classList.remove('timer-urgent');
    const q=selectedQuestions[cpIndex];
    const btns=document.querySelectorAll('.quiz-opt');
    btns.forEach(b=>{
        b.disabled=true;
        const bi=parseInt(b.dataset.i);
        if(bi===ans&&bi===q.correct) b.classList.add('correct-reveal');
        else if(bi===ans) { b.classList.add('selected'); b.classList.add('wrong-reveal'); }
        else if(bi===q.correct) b.classList.add('correct-reveal');
        else b.classList.add('wrong-reveal');
    });
    const fb=document.getElementById('quiz-feedback');
    fb.style.display='block';
    const now=performance.now();
    const answerTime=now-quizTimerStart;
    if(ans===q.correct){
        playCorrectSound();
        // Faster answer = longer boost (up to 5s for instant, 3.5s minimum)
        const fastBonus=Math.max(0, 1-answerTime/QUIZ_TIME)*1500;
        fb.textContent='Riktig! Speed boost!'+(fastBonus>500?' (Rask!)':'');
        fb.style.background='rgba(74,222,128,.2)'; fb.style.color='#4ade80';
        boostEndTime=now+3500+fastBonus;
    } else {
        playWrongSound();
        const p=PENALTIES[Math.floor(Math.random()*PENALTIES.length)];
        activePenalty=p.name; penaltyEndTime=now+p.duration+1200;
        const names={ink:'Ink Splash!',ice:'Ishjul!',reverse:'Omvendte kontroller!',slow:'Slow Motion!',spin:'Spinn!'};
        fb.textContent=(ans===-1?'Tiden er ute! ':'Feil! ')+names[p.name];
        fb.style.background='rgba(248,113,113,.2)'; fb.style.color='#f87171';
        if(p.name==='ink'){
            inkBlobs=[];
            for(let i=0;i<8;i++) inkBlobs.push({x:Math.random()*W,y:Math.random()*H,r:40+Math.random()*80});
        }
    }
    setTimeout(()=>{
        document.getElementById('quiz-overlay').classList.remove('active');
        nextCheckpoint=cpIndex+1; gameState='racing';
        showMobileControls(true);
        fbUpdate('/rooms/'+roomCode+'/players/'+myName,{checkpoint:nextCheckpoint}).catch(()=>{});
    },1200);
}

// FINISH & RESULTS
// ================================================================
async function checkAllFinished(){
    try {
        const p=await fbRead('/rooms/'+roomCode+'/players');
        if(!p) return;
        const vals=Object.values(p);
        if(vals.length>0 && vals.every(v=>v.finished)) await fbUpdate('/rooms/'+roomCode,{state:'finished'});
    } catch(e){}
}
function setupHostFinishListener(){
    if(!isHost||!roomRef)return;
    roomRef.child('players').on('value',()=>{checkAllFinished();});
}
function showResults(data){
    gameState='finished';
    stopEngine();
    stopBgMusic();
    showMobileControls(false); hideAllScreens();
    document.getElementById('quiz-overlay').classList.remove('active');
    document.getElementById('host-overlay').classList.remove('active');
    const players=data.players||{};
    const sorted=Object.entries(players).filter(([,d])=>d.finished).sort((a,b)=>(a[1].finishTime||9999)-(b[1].finishTime||9999));
    const dnf=Object.entries(players).filter(([,d])=>!d.finished);
    document.getElementById('results-title').textContent=sorted.length>0?sorted[0][0]+' vinner!':'Ingen fullf\u00f8rte!';
    const list=document.getElementById('results-list'); list.innerHTML='';
    sorted.forEach(([name,d],i)=>{
        list.innerHTML+='<div class="results-item"><div class="rank">'+(i+1)+'</div><div class="rname">'+esc(name)+'</div><div class="rtime">'+d.finishTime.toFixed(1)+'s</div></div>';
    });
    dnf.forEach(([name])=>{
        list.innerHTML+='<div class="results-item" style="opacity:.5"><div class="rank">-</div><div class="rname">'+esc(name)+'</div><div class="rtime">DNF</div></div>';
    });
    document.getElementById('results-overlay').classList.add('active');
}

// ================================================================
// RENDER (PLAYER VIEW)
// ================================================================
function render() {
    ctx.clearRect(0,0,W,H);
    if(gameState!=='racing'&&gameState!=='checkpoint') return;
    const camX=roadCenterX(car.dist), camD=car.dist;
    // Screen shake
    ctx.save();
    if(screenShakeAmt>0.5){
        ctx.translate((Math.random()-.5)*screenShakeAmt*2, (Math.random()-.5)*screenShakeAmt*2);
    }
    drawWorld(camX, camD);
    // Other players
    for(const [name,d] of Object.entries(otherPlayers)){
        const pos=toScreen(d.worldX||0,d.dist||0,camX,camD);
        if(pos.y<-100||pos.y>H+100) continue;
        drawCar(pos.x,pos.y,nameColor(name),.7,name,0,d.character);
    }
    // My car
    const myPos=toScreen(car.worldX,car.dist,camX,camD);
    const now=performance.now();
    let rot=carTilt;
    if(activePenalty==='spin'&&now<penaltyEndTime) rot=((now%400)/400)*Math.PI*2;
    drawCar(myPos.x,myPos.y,nameColor(myName),1,myName,rot,myCharacter);
    // Shield glow
    if(hasShield){
        const sr=32+Math.sin(shieldPulse)*4;
        ctx.strokeStyle='rgba(56,189,248,'+(0.4+Math.sin(shieldPulse)*0.2)+')';
        ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(myPos.x,myPos.y,sr,0,Math.PI*2); ctx.stroke();
        ctx.fillStyle='rgba(56,189,248,0.06)';
        ctx.beginPath(); ctx.arc(myPos.x,myPos.y,sr,0,Math.PI*2); ctx.fill();
    }
    // Boost particles (persistent array)
    for(const p of boostParticles){
        const sp=toScreen(p.x,p.y,camX,camD);
        ctx.fillStyle=p.color;
        ctx.globalAlpha=p.life;
        ctx.beginPath(); ctx.arc(sp.x,sp.y,2+p.life*3,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
    // Speed lines during boost
    if(now<boostEndTime){
        ctx.strokeStyle='rgba(255,215,0,0.3)';
        ctx.lineWidth=2;
        for(const sl of speedLines){
            ctx.globalAlpha=sl.life*0.5;
            ctx.beginPath();
            ctx.moveTo(sl.x, sl.y);
            ctx.lineTo(sl.x, sl.y+40);
            ctx.stroke();
        }
        ctx.globalAlpha=1;
    }
    // Confetti
    for(const p of confettiParticles){
        ctx.fillStyle=p.color;
        ctx.globalAlpha=p.life;
        ctx.fillRect(p.x-3,p.y-3,6,6);
    }
    ctx.globalAlpha=1;
    ctx.restore(); // End screen shake
    // Checkpoint flash overlay
    if(checkpointFlashAlpha>0){
        ctx.fillStyle='rgba(255,107,53,'+checkpointFlashAlpha+')';
        ctx.fillRect(0,0,W,H);
    }
    // Penalty overlays
    if(activePenalty==='ink'&&now<penaltyEndTime){
        const a=Math.min(1,(penaltyEndTime-now)/1000);
        for(const b of inkBlobs){ctx.fillStyle='rgba(10,10,20,'+(0.85*a)+')';ctx.beginPath();ctx.ellipse(b.x,b.y,b.r,b.r*.7,0,0,Math.PI*2);ctx.fill();}
    }
    if(activePenalty==='reverse'&&now<penaltyEndTime){ctx.fillStyle='rgba(239,83,80,.12)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ef5350';ctx.font='700 15px Montserrat';ctx.textAlign='center';ctx.fillText('\u2194 OMVENDTE KONTROLLER',W/2,34);}
    if(activePenalty==='slow'&&now<penaltyEndTime){ctx.fillStyle='rgba(100,149,237,.1)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#6495ed';ctx.font='700 15px Montserrat';ctx.textAlign='center';ctx.fillText('\u23F3 SLOW MOTION',W/2,34);}
    if(activePenalty==='ice'&&now<penaltyEndTime){ctx.fillStyle='rgba(173,216,230,.1)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#add8e6';ctx.font='700 15px Montserrat';ctx.textAlign='center';ctx.fillText('\u2744 ISHJUL',W/2,34);}
    if(activePenalty==='spin'&&now<penaltyEndTime){ctx.fillStyle='#ffa726';ctx.font='700 15px Montserrat';ctx.textAlign='center';ctx.fillText('SPINN!',W/2,34);}
    if(now<boostEndTime){ctx.fillStyle='rgba(255,215,0,.06)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffd700';ctx.font='700 15px Montserrat';ctx.textAlign='center';ctx.fillText('\u26A1 SPEED BOOST!',W/2,34);}
    // On grass warning
    const rc=roadCenterX(car.dist);
    if(Math.abs(car.worldX-rc)>ROAD_W/2){ctx.fillStyle='rgba(200,50,50,.15)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#f87171';ctx.font='700 14px Montserrat';ctx.textAlign='center';ctx.fillText('Utenfor veien! Saktere...',W/2,H-60);}
    // HUD
    drawProgressHUD(camX, camD, false);
    // Finished text
    if(finished){
        ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,H/2-38,W,76);
        ctx.fillStyle='#ffd700';ctx.font='900 24px Montserrat';ctx.textAlign='center';
        ctx.fillText('M\u00C5L! '+finishTime.toFixed(1)+'s',W/2,H/2+6);
        ctx.fillStyle='rgba(255,255,255,.6)';ctx.font='600 12px Montserrat';
        ctx.fillText('Venter p\u00e5 andre\u2026',W/2,H/2+28);
    }
}

// ================================================================
// DRAW WORLD (road, obstacles, checkpoints, finish)
// ================================================================
function drawWorld(camX, camD) {
    // Grass bg
    ctx.fillStyle='#2d6b28'; ctx.fillRect(0,0,W,H);
    // Grass tufts
    for(const t of grassTufts){
        const p=toScreen(t.worldX,t.dist,camX,camD);
        if(p.y<-20||p.y>H+20) continue;
        ctx.fillStyle=t.dark?'#256b1f':'#3a8432';
        ctx.beginPath(); ctx.arc(p.x,p.y,t.size,0,Math.PI*2); ctx.fill();
    }
    // Road (draw in strips)
    const step=4, startD=camD-H*0.3, endD=camD+H+100;
    for(let d=endD;d>=startD;d-=step){
        const rc=roadCenterX(d);
        const p=toScreen(rc,d,camX,camD);
        // Asphalt
        ctx.fillStyle='#555'; ctx.fillRect(p.x-ROAD_W/2, p.y, ROAD_W, step+1);
        // Curbs
        const cb=Math.floor(d/20)%2;
        ctx.fillStyle=cb?'#cc0000':'#fff';
        ctx.fillRect(p.x-ROAD_W/2-7, p.y, 7, step+1);
        ctx.fillRect(p.x+ROAD_W/2, p.y, 7, step+1);
        // Center + lane dashes
        if(Math.floor(d/28)%2===0){
            ctx.fillStyle='rgba(255,255,255,.2)';
            ctx.fillRect(p.x-1, p.y, 2, step+1);
            const lw=ROAD_W/3;
            ctx.fillRect(p.x-ROAD_W/2+lw-1, p.y, 2, step+1);
            ctx.fillRect(p.x-ROAD_W/2+lw*2-1, p.y, 2, step+1);
        }
    }
    // Checkpoints
    for(let i=0;i<CHECKPOINT_DISTS.length;i++){
        const cd=CHECKPOINT_DISTS[i], rc=roadCenterX(cd);
        const p=toScreen(rc,cd,camX,camD);
        if(p.y<-60||p.y>H+60) continue;
        const done = !isHost && i<nextCheckpoint;
        ctx.fillStyle=done?'rgba(74,222,128,.35)':'rgba(255,107,53,.35)';
        ctx.fillRect(p.x-ROAD_W/2,p.y-16,ROAD_W,32);
        ctx.fillStyle=done?'#4ade80':'#ff6b35';
        ctx.fillRect(p.x-ROAD_W/2-5,p.y-28,5,56);
        ctx.fillRect(p.x+ROAD_W/2,p.y-28,5,56);
        ctx.fillStyle='#fff';ctx.font='700 12px Montserrat';ctx.textAlign='center';
        ctx.fillText(done?'\u2713 CP '+(i+1):'CHECKPOINT '+(i+1),p.x,p.y+4);
    }
    // Finish
    const frc=roadCenterX(FINISH_DIST);
    const fp=toScreen(frc,FINISH_DIST,camX,camD);
    if(fp.y>-60&&fp.y<H+60){
        const sq=13;
        for(let ix=0;ix<Math.ceil(ROAD_W/sq);ix++) for(let iy=0;iy<3;iy++){
            ctx.fillStyle=(ix+iy)%2===0?'#fff':'#111';
            ctx.fillRect(fp.x-ROAD_W/2+ix*sq,fp.y-20+iy*sq,sq,sq);
        }
        ctx.fillStyle='#fff';ctx.font='900 15px Montserrat';ctx.textAlign='center';
        ctx.fillText('M\u00C5L',fp.x,fp.y-28);
    }
    // Obstacles
    for(const obs of obstacles){
        const p=toScreen(obs.worldX,obs.dist,camX,camD);
        if(p.y<-50||p.y>H+50) continue;
        if(obs.type==='cone'){
            ctx.fillStyle='#ff6600';ctx.beginPath();ctx.moveTo(p.x,p.y-10);ctx.lineTo(p.x-8,p.y+8);ctx.lineTo(p.x+8,p.y+8);ctx.closePath();ctx.fill();
            ctx.fillStyle='#fff';ctx.fillRect(p.x-5,p.y,10,3);
        } else if(obs.type==='oil'){
            ctx.fillStyle='rgba(20,20,20,.75)';ctx.beginPath();ctx.ellipse(p.x,p.y,13,8,0,0,Math.PI*2);ctx.fill();
        } else {
            ctx.fillStyle='#cc0000';ctx.fillRect(p.x-23,p.y-6,46,12);ctx.fillStyle='#fff';ctx.fillRect(p.x-23,p.y-1,46,3);
        }
    }
    // Collectibles
    const pulse=Math.sin(performance.now()/300)*0.2+0.8;
    for(const col of collectibles){
        if(col.collected) continue;
        const p=toScreen(col.worldX,col.dist,camX,camD);
        if(p.y<-40||p.y>H+40) continue;
        ctx.save();
        ctx.globalAlpha=pulse;
        if(col.type==='boost'){
            // Gold arrow (boost pad)
            ctx.fillStyle='#ffd700';
            ctx.shadowColor='#ffd700'; ctx.shadowBlur=10*pulse;
            ctx.beginPath();ctx.moveTo(p.x,p.y-12);ctx.lineTo(p.x-10,p.y+6);ctx.lineTo(p.x-4,p.y+6);
            ctx.lineTo(p.x-4,p.y+12);ctx.lineTo(p.x+4,p.y+12);ctx.lineTo(p.x+4,p.y+6);
            ctx.lineTo(p.x+10,p.y+6);ctx.closePath();ctx.fill();
        } else if(col.type==='coin'){
            // Gold circle (coin)
            ctx.fillStyle='#ffd700';
            ctx.shadowColor='#ffd700'; ctx.shadowBlur=8*pulse;
            ctx.beginPath();ctx.arc(p.x,p.y,8,0,Math.PI*2);ctx.fill();
            ctx.fillStyle='#b8860b';ctx.font='bold 10px Montserrat';ctx.textAlign='center';
            ctx.fillText('$',p.x,p.y+4);
        } else if(col.type==='shield'){
            // Blue diamond (shield)
            ctx.fillStyle='#38bdf8';
            ctx.shadowColor='#38bdf8'; ctx.shadowBlur=12*pulse;
            ctx.beginPath();ctx.moveTo(p.x,p.y-12);ctx.lineTo(p.x+10,p.y);
            ctx.lineTo(p.x,p.y+12);ctx.lineTo(p.x-10,p.y);ctx.closePath();ctx.fill();
        }
        ctx.shadowBlur=0;
        ctx.restore();
    }
}

// ================================================================
// PROGRESS HUD
// ================================================================
function drawProgressHUD(camX, camD, isHostView) {
    const barW=130, barH=10, barX=W-barW-14, barY=14;
    ctx.fillStyle='rgba(0,0,0,.5)';
    ctx.beginPath(); ctx.roundRect(barX-4,barY-4,barW+8,barH+22,6); ctx.fill();
    // My progress (player only)
    if(!isHostView){
        const pct=Math.min(1,car.dist/FINISH_DIST);
        ctx.fillStyle='#ff6b35'; ctx.fillRect(barX,barY,barW*pct,barH);
    }
    ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1;ctx.strokeRect(barX,barY,barW,barH);
    // CP markers
    for(let i=0;i<CHECKPOINT_DISTS.length;i++){
        const cx=barX+barW*(CHECKPOINT_DISTS[i]/FINISH_DIST);
        ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(cx-1,barY-1,2,barH+2);
    }
    // All player dots
    for(const [name,d] of Object.entries(otherPlayers)){
        const pp=Math.min(1,(d.dist||0)/FINISH_DIST);
        ctx.fillStyle=nameColor(name);ctx.beginPath();ctx.arc(barX+barW*pp,barY+barH+7,3,0,Math.PI*2);ctx.fill();
    }
    if(!isHostView){
        const pct=Math.min(1,car.dist/FINISH_DIST);
        ctx.fillStyle=nameColor(myName);ctx.strokeStyle='#fff';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.arc(barX+barW*pct,barY+barH+7,4,0,Math.PI*2);ctx.fill();ctx.stroke();
        ctx.fillStyle='#fff';ctx.font='600 10px Montserrat';ctx.textAlign='right';
        ctx.fillText(Math.round(pct*100)+'%',barX-6,barY+9);
        // Coin counter
        if(coinCount>0){
            ctx.fillStyle='#ffd700';ctx.font='700 13px Montserrat';ctx.textAlign='left';
            ctx.fillText('\u2605 '+coinCount,14,barY+9);
        }
        // Shield indicator
        if(hasShield){
            ctx.fillStyle='#38bdf8';ctx.font='700 13px Montserrat';ctx.textAlign='left';
            ctx.fillText('\u25C6',14+(coinCount>0?50:0),barY+9);
        }
    }
}

// ================================================================
// DRAW CAR
// ================================================================
function drawCar(x, y, color, alpha, name, rotation, charKey) {
    const DOG_W=50, DOG_H=48;
    const ch=CHARACTERS[charKey||'luke'];
    const charImg=(ch&&ch.ready)?ch.img:(dogReady?dogImg:null);
    ctx.save(); ctx.globalAlpha=alpha; ctx.translate(x,y);
    if(rotation) ctx.rotate(rotation);
    // Shadow
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(2,DOG_H/2+2,DOG_W/2,8,0,0,Math.PI*2);ctx.fill();
    // Draw character image or fallback
    if(charImg){
        ctx.drawImage(charImg,-DOG_W/2,-DOG_H/2,DOG_W,DOG_H);
        ctx.globalCompositeOperation='source-atop';
        ctx.fillStyle=color; ctx.globalAlpha=0.25;
        ctx.fillRect(-DOG_W/2,-DOG_H/2,DOG_W,DOG_H);
        ctx.globalCompositeOperation='source-over';
        ctx.globalAlpha=alpha;
    } else {
        ctx.fillStyle=color;ctx.beginPath();ctx.arc(0,0,DOG_W/3,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
    // Name label ABOVE character
    ctx.save();ctx.globalAlpha=alpha;ctx.font='600 9px Montserrat';ctx.textAlign='center';
    const tw=ctx.measureText(name).width+8;
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.beginPath();ctx.roundRect(x-tw/2,y-DOG_H/2-18,tw,14,4);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillText(name,x,y-DOG_H/2-8);ctx.restore();
}

// ================================================================
// EVENTS
// ================================================================
document.getElementById('btn-create').addEventListener('click',()=>createRoom());
document.getElementById('btn-join').addEventListener('click',()=>{
    myName=document.getElementById('input-name').value.trim();
    roomCode=document.getElementById('input-code').value.trim();
    if(!myName){showStatus('Skriv inn navnet ditt!',true);return;}
    if(!roomCode){showStatus('Skriv inn spillkoden!',true);return;}
    joinRoom();
});

// Character selection
const unlockedChars = new Set();
function populateCharSelect(){
    const grid=document.getElementById('char-grid');
    grid.innerHTML='';
    const srcs={luke:dogImg.src,asta:astaImg.src,kasper:kasperImg.src,albin:albinImg.src,admin:adminImg.src,leader:leaderImg.src};
    for(const [key,ch] of Object.entries(CHARACTERS)){
        const card=document.createElement('div');
        const isLocked = ch.locked && !unlockedChars.has(key);
        card.className='char-card' + (isLocked ? ' locked' : '');
        card.dataset.key=key;
        card.innerHTML='<img src="'+srcs[key]+'"><div class="char-name">'+ch.name+'</div>';
        if(!isLocked){
            card.onclick=()=>{
                myCharacter=key;
                grid.querySelectorAll('.char-card').forEach(c=>c.classList.remove('selected'));
                card.classList.add('selected');
                const btn=document.getElementById('btn-confirm-char');
                btn.style.opacity='1';btn.style.pointerEvents='auto';
            };
        }
        grid.appendChild(card);
    }
}

// Promo code system
const PROMO_CODES = { 'KIMURA': 'leader' };
document.getElementById('btn-promo').addEventListener('click',()=>{
    const input=document.getElementById('input-promo');
    const msg=document.getElementById('promo-msg');
    const code=input.value.trim().toUpperCase();
    const charKey=PROMO_CODES[code];
    if(charKey && !unlockedChars.has(charKey)){
        unlockedChars.add(charKey);
        msg.textContent='\u2705 '+CHARACTERS[charKey].name+' er nå låst opp!';
        msg.className='promo-msg success';
        input.value='';
        // Re-render grid and animate unlocked card
        populateCharSelect();
        const unlocked=document.querySelector('.char-card[data-key="'+charKey+'"]');
        if(unlocked) unlocked.classList.add('unlocked-anim');
    } else if(unlockedChars.has(charKey)){
        msg.textContent='Allerede låst opp!';
        msg.className='promo-msg success';
    } else {
        msg.textContent='\u274C Ugyldig kode';
        msg.className='promo-msg error';
    }
});
document.getElementById('input-promo').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('btn-promo').click();});
document.getElementById('btn-confirm-char').addEventListener('click',async()=>{
    await fbUpdate('/rooms/'+roomCode+'/players/'+myName,{character:myCharacter});
    gameState='lobby';
    showScreen('lobby');
    startBgMusic('lobby');
});
async function hostStartRace() {
    const btn=document.getElementById('btn-start');
    btn.disabled=true; btn.textContent='Starter...';
    try {
        await fbUpdate('/rooms/'+roomCode, { state: 'racing' });
        setupHostFinishListener();
    } catch(e) {
        btn.disabled=false; btn.textContent='Start race!';
        document.getElementById('conn-status').textContent='Feil: '+e.message;
    }
}
document.getElementById('btn-start').addEventListener('click',()=>hostStartRace());
document.getElementById('btn-again').addEventListener('click',()=>{
    if(roomRef) roomRef.off(); roomRef=null; isHost=false; gameState='menu'; finished=false; otherPlayers={}; stopBgMusic();
    document.getElementById('results-overlay').classList.remove('active');
    document.getElementById('host-overlay').classList.remove('active');
    showScreen('start');
});
document.getElementById('input-name').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('input-code').focus();});
document.getElementById('input-code').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('btn-join').click();});
document.getElementById('input-code').addEventListener('input',e=>{e.target.value=e.target.value.replace(/[^0-9]/g,'');});

// Connection check on load
let fbConnected=false, connTimer=null;
db.ref('.info/connected').on('value', snap => {
    const el=document.getElementById('conn-status');
    if(snap.val()===true){
        fbConnected=true;
        el.textContent='Tilkoblet!'; el.style.color='#4ade80';
        if(connTimer) clearTimeout(connTimer);
        setTimeout(()=>{ el.textContent=''; },2000);
    } else {
        if(fbConnected){ el.textContent='Mistet tilkobling...'; el.style.color='#f87171'; }
    }
});
// Show warning only if not connected after 3 seconds
connTimer=setTimeout(()=>{
    if(!fbConnected){
        document.getElementById('conn-status').textContent='Kobler til Firebase...';
        document.getElementById('conn-status').style.color='#fbbf24';
    }
},3000);
// Fallback: test with actual write/read after 5s
setTimeout(async()=>{
    if(fbConnected) return;
    try {
        const testRef=db.ref('_ping');
        await testRef.set(Date.now());
        await testRef.remove();
        fbConnected=true;
        const el=document.getElementById('conn-status');
        el.textContent='Tilkoblet!'; el.style.color='#4ade80';
        setTimeout(()=>{ el.textContent=''; },2000);
    } catch(e){
        document.getElementById('conn-status').textContent='Kan ikke koble til Firebase: '+e.message;
        document.getElementById('conn-status').style.color='#f87171';
    }
},5000);
</script>
